<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="leaves" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Leaf 1 -->
      <ellipse cx="30" cy="40" rx="15" ry="25" fill="#81c784" opacity="0.15" transform="rotate(-30 30 40)"/>
      <ellipse cx="32" cy="42" rx="12" ry="22" fill="#66bb6a" opacity="0.1" transform="rotate(-30 32 42)"/>
      
      <!-- Leaf 2 -->
      <ellipse cx="150" cy="80" rx="18" ry="28" fill="#4caf50" opacity="0.12" transform="rotate(45 150 80)"/>
      <ellipse cx="152" cy="82" rx="14" ry="24" fill="#66bb6a" opacity="0.08" transform="rotate(45 152 82)"/>
      
      <!-- Leaf 3 -->
      <ellipse cx="90" cy="140" rx="16" ry="26" fill="#81c784" opacity="0.13" transform="rotate(15 90 140)"/>
      <ellipse cx="92" cy="142" rx="13" ry="23" fill="#a5d6a7" opacity="0.09" transform="rotate(15 92 142)"/>
      
      <!-- Leaf 4 -->
      <ellipse cx="170" cy="30" rx="14" ry="24" fill="#66bb6a" opacity="0.11" transform="rotate(-60 170 30)"/>
      
      <!-- Leaf 5 -->
      <ellipse cx="50" cy="160" rx="17" ry="27" fill="#4caf50" opacity="0.14" transform="rotate(60 50 160)"/>
      
      <!-- Small leaves scattered -->
      <ellipse cx="120" cy="20" rx="8" ry="14" fill="#81c784" opacity="0.1" transform="rotate(20 120 20)"/>
      <ellipse cx="180" cy="150" rx="9" ry="15" fill="#a5d6a7" opacity="0.12" transform="rotate(-40 180 150)"/>
      <ellipse cx="20" cy="100" rx="10" ry="16" fill="#66bb6a" opacity="0.09" transform="rotate(80 20 100)"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#leaves)"/>
</svg>
